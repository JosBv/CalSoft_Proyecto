<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="../css/estilos.css">

</head>

<body class="login-body">

    <div class="login-card">

        <!-- LOGO -->
        <img src="../imagenes/logo.png"
             class="login-logo"
             alt="Logo">

        <!-- TITULO -->
        <h3 class="text-center text-danger mb-4">
            Iniciar Sesión
        </h3>

        <!-- USUARIO -->
        <div class="mb-3">

            <label class="form-label">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                class="form-control"
                placeholder="Ingrese su usuario">

        </div>

        <!-- CONTRASEÑA -->
        <div class="mb-3">

            <label class="form-label">
                Contraseña
            </label>

            <input
                type="password"
                id="clave"
                class="form-control"
                placeholder="Ingrese su contraseña">

        </div>

        <!-- BOTON -->
        <button
            class="btn btn-danger w-100"
            onclick="login()">

            Ingresar

        </button>

        <!-- MENSAJE -->
        <p id="mensaje"
           class="text-center mt-3 fw-semibold">
        </p>

    </div>

    <!-- JS -->
    <script src="../js/login.js"></script>

</body>
</html>
